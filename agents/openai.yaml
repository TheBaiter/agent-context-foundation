interface:
  display_name: "Agent Context Foundation"
  short_description: "Minimal safe repo changes, scoped agent context, regression checks"
  default_prompt: "Use $agent-context-foundation for this repository task. Check existing AGENTS.md and the relevant Agent/ route once; identify the requested boundary and choose the smallest complete safe change using existing code. Read only task-relevant files and issues when needed, implement and verify positive/negative behavior and regressions, then record meaningful agent-caused mistakes in one issue with a concise Agent error-memory pointer. Do not turn routine engineering into a context audit."
policy:
  allow_implicit_invocation: true
